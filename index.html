<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Personal photography portfolio of Marcin Jaruszewicz, featuring studio fashion portraits, nature and wildlife photography, travel images, and photographs from Japan."
    />
    <title>Marcin&#039;s spot &#8211; Personal photography website featuring Marcin Jaruszewicz original images grouped into: studio fashion and portrait photography, nature and wildlife photography, travel photography, portrait photography of people, and photographs taken in Japan.</title>
    <!-- Bump ?v=... on every CSS/JS/data change so clients cache assets between deploys but refresh after one. -->
    <link rel="stylesheet" href="portfolio.css?v=20260820c" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/"><span class="brand__owner">Marcin Jaruszewicz's</span> Photo<span class="brand__portfolio">Portfolio</span></a>
      <nav class="nav-actions" id="header-nav" aria-label="Primary"></nav>
    </header>

    <main id="app-root"></main>

    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Full screen photo">
      <div id="lightbox-stage" class="lightbox__stage">
        <div class="lightbox__prev-stack">
          <button
            type="button"
            id="lightbox-prev"
            class="lightbox__play"
            aria-label="Previous"
            data-tooltip="Previous"
          >
            &lt;
          </button>
        </div>
        <div class="lightbox__photo-wrap">
          <img id="lightbox-image" class="lightbox__image" alt="" />
          <p class="lightbox__watermark" aria-hidden="true">© Marcin Jaruszewicz</p>
        </div>
        <div class="lightbox__next-stack">
          <button
            type="button"
            id="lightbox-next"
            class="lightbox__play"
            aria-label="Next"
            data-tooltip="Next"
          >
            &gt;
          </button>
          <button
            type="button"
            id="lightbox-play"
            class="lightbox__play"
            aria-label="Play"
            data-tooltip="Play"
          >
            &gt;&gt;
          </button>
          <button
            type="button"
            id="lightbox-fast-play"
            class="lightbox__play"
            aria-label="Fast play"
            data-tooltip="Fast play"
          >
            &gt;&gt;&gt;
          </button>
        </div>
        <p class="lightbox__hint">Arrow keys · Click outside to close</p>
      </div>
    </div>

    <!-- Deferred scripts execute in document order after parsing; data files load before portfolio.js. -->
    <script defer src="gallery-data.js?v=20260621i"></script>
    <script defer src="tribute-data.js?v=20260621i"></script>
    <script defer src="support-data.js?v=20260621i"></script>
    <script defer src="portfolio.js?v=20260820c"></script>
  </body>
</html>
